
services:
  backstage:
    image: backstage:github-auth
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: backstage-backend
    restart: unless-stopped
    init: true

    # Expose Backstage only on the host's loopback interface.
    # Tailscale Serve forwards HTTPS traffic to this port.
    ports:
      - "127.0.0.1:7007:7007"

    # These variables are read from the project's .env file
    # by Docker Compose and explicitly passed into the container.
    environment:
      NODE_ENV: production
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      AUTH_GITHUB_CLIENT_ID: "${AUTH_GITHUB_CLIENT_ID:?Set AUTH_GITHUB_CLIENT_ID in .env}"
      AUTH_GITHUB_CLIENT_SECRET: "${AUTH_GITHUB_CLIENT_SECRET:?Set AUTH_GITHUB_CLIENT_SECRET in .env}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:?Set GITHUB_TOKEN in .env}"

    depends_on:
      postgres:
        condition: service_healthy

    cpus: 2.0
    mem_limit: 3g
    memswap_limit: 6g

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  postgres:
    image: postgres:16
    container_name: backstage-postgres
    restart: unless-stopped

    # Credentials must match those used by Backstage.
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: backstage


    # Keep your existing volume declaration and name.
    volumes:
      - postgres-data:/var/lib/postgresql/data

    # Backstage waits for PostgreSQL to become healthy.
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    cpus: 1.0
    mem_limit: 2g
    memswap_limit: 4g

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres-data:
